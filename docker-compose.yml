services:
  # Our PostgreSQL database
  db:
    # The Docker image of postgres -- we're using the latest.
    image: postgres:latest
    # The ports to expose to the host container
    # 5432 is the default PostgreSQL port
    ports:
      - "5432:5432"
    # If we accidentally kill the running container, Docker Compose
    # will restart it.
    restart: always
    # Credentials are read from .env (see .env.example). Defaults
    # below are for local dev only -- override them in prod.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Spring Boot backend. Builds from ./backend using the multi-stage
  # Dockerfile there. Waits for Postgres to report healthy before start.
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow123}
      JWT_SECRET: ${JWT_SECRET:-ZmFrZS1kZXYtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi1wbGVhc2UtcmVwbGFjZS1tZQ==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
