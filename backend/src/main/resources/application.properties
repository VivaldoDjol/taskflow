spring.application.name=taskflow

server.servlet.context-path=/api

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow
spring.datasource.username=taskflow
spring.datasource.password=taskflow123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

security.jwt.secret=${JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi1wbGVhc2UtcmVwbGFjZS1tZQ==}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}